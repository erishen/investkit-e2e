[project]
name = "investkit-e2e-tests"
version = "1.0.0"
description = "E2E Tests for InvestKit Projects using Playwright"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "InvestKit Team"}
]

dependencies = [
    "playwright>=1.40.0",
    "pytest>=7.4.0",
    "pytest-playwright>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.5.0",
    "pytest-html>=3.2.0",
    "pytest-xdist>=3.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "api: API endpoint tests",
    "ui: UI tests",
    "asset_lens: asset-lens tests",
    "ts_demo: ts-demo tests",
    "solo_chat: solo-chat tests",
    "stock_analyzer: stock-analyzer tests",
    "lobster: lobster tests",
    "investkit_utils: investkit-utils tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PERF", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "PERF203", "PERF401", "RUF012", "SIM117", "E501", "E402", "N806", "N803", "E741", "B008", "SIM115", "UP041", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF012"]
# conftest.py / fixtures/__init__.py: imports are pytest fixture registration
# (side-effect re-exports), removing them would un-register the fixtures.
"tests/conftest.py" = ["F401"]
"tests/fixtures/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
