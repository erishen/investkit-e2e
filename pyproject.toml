[project]
name = "investkit-e2e-tests"
version = "1.0.0"
description = "E2E Tests for InvestKit Projects using Playwright"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "InvestKit Team"}
]

dependencies = [
    "playwright>=1.40.0",
    "pytest>=7.4.0",
    "pytest-playwright>=0.4.0",
    "pytest-asyncio>=0.21.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --headed"
markers = [
    "slow: marks tests as slow",
    "api: API endpoint tests",
    "ui: UI tests",
    "asset_lens: asset-lens tests",
    "ts_demo: ts-demo tests",
    "solo_chat: solo-chat tests",
    "stock_analyzer: stock-analyzer tests",
    "lobster: lobster tests",
    "investkit_utils: investkit-utils tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
